# MH Game Shop — production with domain + automatic HTTPS (Caddy).
# Prereqs: DNS A-records for mhgameshop.com, www, admin., api. → server IP.
#
# Usage:
#   docker compose -f docker-compose.domain.yml up -d --build
#
# Caddy provisions Let's Encrypt certs on first request. Set env URLs to the
# https domains and COOKIE_SECURE=true (see apps/api/.env).

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mhgs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mhgs_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mhgameshop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mhgs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads:/app/apps/api/public/storage

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    command: ["npx", "tsx", "src/queue/worker.ts"]
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      - api
      - redis
    volumes:
      - uploads:/app/apps/api/public/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.mhgameshop.com}
    restart: always
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.mhgameshop.com}
    restart: always
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - admin
      - api

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config:
