# MH Game Shop — production stack.
# Usage:  docker compose -f docker-compose.prod.yml up -d --build
# Provide secrets via a root .env file (see .env.example + apps/*/.env.example).

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mhgs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mhgs_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mhgameshop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mhgs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - uploads:/app/apps/api/public/storage

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    command: ["npx", "tsx", "src/queue/worker.ts"]
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
    depends_on:
      - api
      - redis
    volumes:
      - uploads:/app/apps/api/public/storage

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.mhgameshop.com}
    restart: always
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.mhgameshop.com}
    restart: always
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - admin
      - api

volumes:
  pgdata:
  redisdata:
  uploads:
