# MH Game Shop — nginx reverse proxy (production)
# Routes each subdomain to the matching container.

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 8m;

  # gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  gzip_min_length 1024;

  # ---- Upstreams ----
  upstream web_upstream   { server web:3000; }
  upstream admin_upstream { server admin:3001; }
  upstream api_upstream   { server api:4000; }

  # ---- Storefront: mhgameshop.com ----
  server {
    listen 80;
    server_name mhgameshop.com www.mhgameshop.com;

    location / {
      proxy_pass         http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }

  # ---- Admin panel: admin.mhgameshop.com ----
  server {
    listen 80;
    server_name admin.mhgameshop.com;

    location / {
      proxy_pass         http://admin_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }

  # ---- API + websockets: api.mhgameshop.com ----
  server {
    listen 80;
    server_name api.mhgameshop.com;

    location / {
      proxy_pass         http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Socket.io — upgrade to WebSocket.
    location /socket.io/ {
      proxy_pass         http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }
  }
}
