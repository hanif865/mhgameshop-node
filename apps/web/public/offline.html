<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — MH Game Shop</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f0f4ff;
        color: #15803d;
        text-align: center;
      }
      .box { padding: 2rem; }
      h1 { margin: 0.5rem 0; }
      p { color: #475569; }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1.4rem;
        border: none;
        border-radius: 0.75rem;
        background: #16a34a;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>You're offline</h1>
      <p>Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
